[package]
name = "datafusion-functions-variant"
description = "Parquet Variant functions for the DataFusion query engine"
keywords = ["datafusion", "variant", "json", "expressions"]
readme = "README.md"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[lib]
name = "datafusion_functions_variant"

[features]
default = ["sql"]
sql = ["datafusion-expr/sql"]

[dependencies]
arrow = { workspace = true }
datafusion-common = { workspace = true, features = ["variant"] }
datafusion-expr = { workspace = true, default-features = false }
datafusion-expr-common = { workspace = true }
parquet-variant = { workspace = true }
parquet-variant-compute = { workspace = true }
parquet-variant-json = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
